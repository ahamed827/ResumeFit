[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous single-letter variable names
    "F403",  # star imports
    "F405",  # star imports undefined names
    "F821",  # forward reference strings in SQLAlchemy Mapped types
    "F841",  # local variable assigned to but never used
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
